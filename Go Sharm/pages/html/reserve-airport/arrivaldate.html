<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrival Date - Web</title>
    <link rel="stylesheet" href="../../css/style airport/date.css">
</head>
<body>

    <div class="web-container">
        <header class="calendar-header">
            <button class="back-btn">←</button>
            <h1>Arrival Date</h1>
        </header>

        <div class="calendar-card">
            
            <div class="month-selector">
                <button class="nav-arrow">‹</button>
                <div class="current-date">
                    <span class="month">Oct</span>
                    <span class="year">2024</span>
                </div>
                <button class="nav-arrow">›</button>
            </div>

            <div class="days-grid">
                <div class="day-name">Mo</div>
                <div class="day-name">Tu</div>
                <div class="day-name">We</div>
                <div class="day-name">Th</div>
                <div class="day-name">Fr</div>
                <div class="day-name">Sa</div>
                <div class="day-name">Su</div>

                <div class="day prev-month">29</div>
                <div class="day prev-month">30</div>
                <div class="day prev-month">31</div>
                <div class="day">1</div>
                <div class="day">2</div>
                <div class="day">3</div>
                <div class="day">4</div>
                <div class="day">5</div>
                <div class="day">6</div>
                <div class="day selected">7</div> <div class="day">8</div>
                <div class="day">9</div>
                <div class="day">10</div>
                <div class="day">11</div>
                </div>

            <div class="action-buttons">
                <button class="confirm-btn">Confirm</button>
                <button class="cancel-btn">Cancel</button>
            </div>
        </div>
    </div>

</body>
</html>
