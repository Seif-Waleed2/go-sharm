<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flight Number</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="../../css/style airport/flightnum.css">
</head>
<body>

    <div class="flight-container">
        <div class="status-bar d-flex justify-content-between align-items-center">
            <span>9:41</span>
            <div class="d-flex gap-2">
                <i class="bi bi-reception-4"></i>
                <i class="bi bi-wifi"></i>
                <i class="bi bi-battery-full"></i>
            </div>
        </div>

        <div class="navbar-custom">
            <a href="#" class="back-btn"><i class="bi bi-arrow-left"></i></a>
            <h1>Flight Number</h1>
        </div>

        <div class="search-section">
            <div class="search-wrapper">
                <input type="text" class="search-input" value="MM566" placeholder="Enter flight number">
                <i class="bi bi-x-circle-fill clear-btn"></i>
            </div>
        </div>

        <div class="results-list">
            <a href="#" class="flight-item">
                <div class="flight-icon"><i class="bi bi-airplane"></i></div>
                <div class="flight-info-main">
                    <div class="flight-route">
                        <span class="number">MM529</span> NRT <i class="bi bi-arrow-right small"></i> Fuk
                    </div>
                    <div class="departs-text">Departs 19:20</div>
                </div>
            </a>

            <a href="#" class="flight-item">
                <div class="flight-icon"><i class="bi bi-airplane"></i></div>
                <div class="flight-info-main">
                    <div class="flight-route">
                        <span class="number">MM529</span> NRT <i class="bi bi-arrow-right small"></i> Fuk
                    </div>
                    <div class="departs-text">Departs 19:20</div>
                </div>
            </a>

            <a href="#" class="flight-item">
                <div class="flight-icon"><i class="bi bi-airplane"></i></div>
                <div class="flight-info-main">
                    <div class="flight-route">
                        <span class="number">MM529</span> NRT <i class="bi bi-arrow-right small"></i> Fuk
                    </div>
                    <div class="departs-text">Departs 19:20</div>
                </div>
            </a>
        </div>
    </div>

</body>
</html>
